name: Frictionless profile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frictionless-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frictionless-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEOCONNEXR_FRICTIONLESS_CLI: ${{ github.workspace }}/.venv/bin/frictionless
      GEOCONNEXR_RUN_LIVE: "false"
      TZ: UTC

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::arrow
            any::pkgload
            any::testthat
            any::withr

      - name: Install pinned Frictionless CLI
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check frictionless==5.19.0

      - name: Validate fixed Data Package profiles
        run: |
          pkgload::load_all()
          for (path in c(
            "tests/testthat/test-package-frictionless.R",
            "tests/testthat/test-package-frictionless-mixed.R",
            "tests/testthat/test-package-frictionless-public.R"
          )) {
            testthat::test_file(
              path,
              reporter = "summary",
              stop_on_failure = TRUE
            )
          }
        shell: Rscript {0}
